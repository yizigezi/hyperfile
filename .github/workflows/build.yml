name: Build HyperFile

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperfile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-build:
    name: Falcon app package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Install aiot-cli
        run: npm install --global aiot-vue-cli@1.0.32

      - name: Install project dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install zig (pinned)
        run: python3 -m pip install ziglang==0.17.1

      - name: Build standalone HTTP daemon and controller (X5 / ARMv7)
        run: bash tools/build-httpd.sh

      - name: Build standalone HTTP daemon and controller (X7P / ARM64)
        run: bash tools/build-httpd.sh arm64

      - name: Generate build metadata
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const metadata = {
            version: require('./package.json').version,
            commit: '${{ github.sha }}'.slice(0, 7),
            branch: '${{ github.ref_name }}',
            builtAt: new Date().toISOString().slice(0, 10)
          }
          fs.writeFileSync('src/utils/BuildInfo.js',
            '// Generated by GitHub Actions; local builds use the fallback values below.\n' +
            'export default ' + JSON.stringify(metadata, null, 2) + '\n')
          console.log('Build metadata:', JSON.stringify(metadata))
          NODE

      - name: Check project
        run: npm run check

      - name: Build production AMR
        run: npm run build:prod

      - name: Upload AMR package
        uses: actions/upload-artifact@v4
        with:
          name: hyperfile-amr
          path: "*.amr"
          if-no-files-found: error
          retention-days: 14
